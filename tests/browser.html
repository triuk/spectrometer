<!doctype html><meta charset="utf-8"><title>Spectrometer integration</title>
<body><script type="module">
const checks=[];
const assert=(condition,message)=>{if(!condition)throw Error(message);};
const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
async function until(predicate,message,timeout=10000){const end=performance.now()+timeout;while(performance.now()<end){if(await predicate())return;await sleep(10);}throw Error(message);}
async function app(config={}) {
  window.testConfig=config;
  localStorage.clear();
  localStorage.setItem('spectrometer.cameraDeviceByProfile',JSON.stringify({'lgs-default':'usb-old'}));
  const html=await (await fetch('/prototype/index.html')).text();
  const iframe=document.createElement('iframe');iframe.style.cssText='width:1400px;height:1000px';document.body.append(iframe);
  iframe.srcdoc=html.replace('<head>','<head><base href="/prototype/">').replace('<script type="module" src="main.js"></'+'script>','<script type="module">window.testErrors=[];window.addEventListener("error",e=>window.testErrors.push(e.message));window.addEventListener("unhandledrejection",e=>window.testErrors.push(String(e.reason)));await import("/tests/fake-camera.js");await import("/prototype/main.js");window.appReady=true;</'+'script>');
  await until(()=>iframe.contentWindow.appReady,'Application initialization failed: '+iframe.contentWindow.testErrors);
  const w=iframe.contentWindow;
  const core=await w.eval('import("/prototype/core.js")');
  const camera=await w.eval('import("/prototype/camera.js")');
  const spectrum=await w.eval('import("/prototype/spectrum.js")');
  const operations=await w.eval('import("/prototype/camera-operations.js")');
  return {iframe,w,core,camera,spectrum,operations};
}
try {
  let a=await app({canvasFallback:true});
  assert(!a.core.state.track,'Camera must not start automatically');
  await a.camera.startCamera();assert(a.core.state.measurementReady,"Startup failed: "+a.core.elements.cameraStatus.textContent+" / "+a.w.testErrors);await until(()=>a.core.state.averagedSpectrum,'No spectral data');
  assert(a.core.state.track.label.includes('USB-ZH'),'Profile rediscovery selected wrong camera');
  assert(a.w.fakeRequests[0].video.deviceId.exact==='usb-old','Saved ID was not tried');
  assert(a.core.state.track.getSettings().exposureMode==='manual','Manual mode missing');
  assert(a.core.state.track.applied.every(c=>!c.advanced || !Object.values(c.advanced[0]).includes('continuous')),'Automatic mode requested during startup');
  assert(a.core.state.track.getSettings().exposureTime<=1800,'Exposure limit not enforced');
  checks.push('USB rediscovery, explicit manual initialization and exposure limit');
  const history=a.core.state.spectrumHistory.length;a.w.freezeFakeFrames=true;await sleep(60);
  assert(a.core.state.spectrumHistory.length===history,'Frozen frame was counted repeatedly');a.w.freezeFakeFrames=false;
  checks.push('Averaging counts fresh frames only');
  a.spectrum.captureDarkSpectrum();assert(a.core.state.darkSpectrum,'Dark capture failed');
  await a.camera.applyTrackConstraint('exposureTime',27);
  assert(!a.core.state.darkSpectrum,'Old dark spectrum survived exposure change');
  await until(()=>a.core.state.averagedSpectrum,'No data after manual exposure');
  const e=a.core.elements;const rect=e.overlayCanvas.getBoundingClientRect();
  const event=(x,y)=>({clientX:rect.left+rect.width*x,clientY:rect.top+rect.height*y,pointerId:1});
  // Programmatic pointer events have no pointer capture; exercise the same staged selection.
  a.core.state.dragStart={x:100,y:20};a.core.state.pendingRoi={...a.core.state.roi};
  const old={...a.core.state.roi};a.spectrum.updateRoiDrag(event(.8,.5));
  assert(JSON.stringify(a.core.state.roi)===JSON.stringify(old),'ROI mutated before confirmation');
  a.spectrum.endRoiDrag(event(.8,.5));assert(!a.core.state.averagedSpectrum,'ROI did not invalidate old average');
  await until(()=>a.core.state.averagedSpectrum,'No data after ROI');
  assert(a.core.state.averagedSpectrum.red.every(Number.isFinite),'ROI average contains NaN');
  checks.push('Dark invalidation and atomic ROI without NaN');
  const optimizer=await a.w.eval('import("/prototype/exposure-optimizer.js")');
  const diagnostic=await a.w.eval('import("/prototype/exposure-diagnostics.js")');
  a.spectrum.initialiseDefaultRoi();
  await optimizer.optimizeExposure();
  const finalExposure=a.core.state.track.getSettings().exposureTime;
  assert(finalExposure>=26 && finalExposure<=29,'Piecewise optimizer missed target: '+finalExposure);
  assert(a.core.state.track.applied.filter(c=>c.advanced?.[0]?.exposureTime!==undefined).at(-1).advanced[0].exposureTime===finalExposure,'Optimizer did not lock final exposure');
  checks.push('Piecewise optimizer reaches target and locks the final exposure');
  await until(()=>a.core.state.averagedSpectrum,'No measurement after optimization');
  const exportedFrames=a.core.state.spectrumHistory.length;
  a.spectrum.exportCsv();const csv=await (await a.w.fakeDownloads.at(-1).blob).text();
  const metadata=JSON.parse(csv.split('\n')[0].slice('# metadata='.length));
  assert(metadata.cameraSettings.exposureTime===finalExposure && metadata.averagedFrames===exportedFrames,'CSV metadata did not match sampled conditions');
  const downloadsBeforePng=a.w.fakeDownloads.length;
  a.spectrum.saveFrame();await until(()=>a.w.fakeDownloads.length>downloadsBeforePng,"PNG download missing");const png=await a.w.fakeDownloads.at(-1).blob;const bitmap=await createImageBitmap(png);const canvas=document.createElement('canvas');canvas.width=bitmap.width;canvas.height=bitmap.height;const ctx=canvas.getContext('2d');ctx.drawImage(bitmap,0,0);
  const left=ctx.getImageData(0,0,1,1).data;assert(left[2]>left[0],'PNG was not oriented like the mirrored preview');
  checks.push('CSV metadata follows samples; saved PNG preserves spectral orientation');
  a.iframe.contentDocument.querySelector('.exposure-diagnostic-step').value='1800';
  a.iframe.contentDocument.querySelector('.exposure-diagnostic-mode').value='forward';
  await diagnostic.runDiagnostics();assert(a.core.state.track.getSettings().exposureTime===finalExposure,'Diagnostics did not restore exposure');
  a.iframe.contentDocument.querySelector('.exposure-diagnostic-json').click();
  const sweep=JSON.parse(await (await a.w.fakeDownloads.at(-1).blob).text());
  assert(sweep.points.length===2 && sweep.points.every(point=>point.frames.length>=4),'Diagnostics did not collect fresh frame metrics');
  checks.push('Diagnostic sweep exports fresh frame metrics and restores original exposure');
  a.w.freezeFakeFrames=true;const optimization=optimizer.optimizeExposure();await sleep(20);
  const requested=a.core.state.track.applied.length;await diagnostic.runDiagnostics();
  assert(a.core.state.track.applied.length===requested,'Diagnostics changed exposure during optimization');
  a.camera.stopCamera();await optimization;
  assert(!a.operations.cameraOperations.active,'Stop left operation locked');
  assert(!a.core.state.darkSpectrum && !a.core.state.averagedSpectrum,'Stop retained measurement data');
  checks.push('Exclusive exposure operations and abort on stopped frames');
  assert(a.w.testErrors.length===0,'Runtime errors: '+a.w.testErrors.join('; '));a.iframe.remove();
  a=await app({fallback:true,canvasFallback:true});await a.camera.startCamera();assert(a.core.state.measurementReady,"Startup failed: "+a.core.elements.cameraStatus.textContent+" / "+a.w.testErrors);await until(()=>a.core.state.averagedSpectrum,'Fallback did not produce data');
  assert(a.core.elements.video.videoWidth===1280,'Fallback resolution mismatch');
  assert(a.spectrum.calibration()===null,'Fallback used stale wavelength calibration');
  assert(a.core.elements.pixel2.value==='1919','Calibration was silently scaled');
  a.iframe.contentDocument.querySelector('#instrumentProfileExport').click();
  const exported=JSON.parse(await (await a.w.fakeDownloads.at(-1).blob).text());
  assert(exported.camera.width===1280 && exported.calibration.captureMode.width===1920 && exported.calibration.valid===false,'Profile export lost calibration capture mode');
  a.core.elements.pixel1.value='0';a.core.elements.pixel2.value='1279';a.spectrum.confirmCalibration();
  assert(a.spectrum.calibration()?.captureMode.width===1280,'Calibration confirmation failed');
  checks.push('Fallback invalidates wavelength calibration until explicit confirmation');
  a.camera.stopCamera();a.iframe.remove();
  a=await app({delayPermission:true,canvasFallback:true});const starting=a.camera.startCamera();await sleep(10);a.camera.stopCamera();await starting;await sleep(100);
  assert(a.w.fakeTracks.every(track=>track.readyState==='ended'),'Cancelled permission request leaked camera');
  assert(!a.core.state.track,'Late permission completion restarted camera');
  checks.push('Cancelled camera startup closes late streams');
  a.iframe.remove();
  a=await app({peaks:true});await a.camera.startCamera();
  await until(()=>a.core.state.plotRenderer==='uplot' && a.w.lastPlot?.data[0]?.length,'uPlot did not render');
  assert(a.core.elements.plotCanvas.style.display==='none','Canvas was not hidden');
  assert(a.w.getComputedStyle(a.iframe.contentDocument.querySelector('.spectrum-empty')).display==='none','Empty message covered live graph');
  assert(a.w.getComputedStyle(a.core.elements.videoPlaceholder).display==='none','Placeholder covered live preview');
  const draws=a.w.legacyPlotDraws;await sleep(80);assert(a.w.legacyPlotDraws===draws,'Hidden Canvas kept rendering');
  const chart=a.w.lastPlot;const span=chart.scales.x.max-chart.scales.x.min;const over=chart.over.getBoundingClientRect();
  chart.over.dispatchEvent(new a.w.WheelEvent('wheel',{deltaY:-100,clientX:over.left+over.width/2,clientY:over.top+over.height/2,bubbles:true,cancelable:true}));
  await until(()=>chart.scales.x.max-chart.scales.x.min<span,'Wheel zoom failed',1500);
  a.iframe.contentDocument.querySelector('.spectrum-chart-actions button').click();
  await until(()=>Math.abs((chart.scales.x.max-chart.scales.x.min)-span)<.001,'Reset zoom failed',1500);
  await until(()=>a.iframe.contentDocument.querySelector('.spectrum-peak-marker'),'Peak marker missing');
  const marker=a.iframe.contentDocument.querySelector('.spectrum-peak-marker');assert(!marker.title.includes('NaN'),'Peak sensor pixel lost during chart creation');
  a.iframe.contentDocument.querySelector('.spectrum-calibration-button').click();marker.click();
  assert(Number.isFinite(Number(a.core.elements.pixel1.value)),'Peak selection corrupted calibration');
  assert(a.w.testErrors.length===0,'uPlot runtime errors: '+a.w.testErrors.join('; '));
  checks.push('Actual uPlot, wheel/reset zoom, peaks and calibration selection without hidden Canvas work');
  a.core.elements.pixel1.value='0';a.core.elements.pixel2.value='1919';a.core.elements.wavelength1.value='700';a.core.elements.wavelength2.value='400';a.core.elements.wavelength1.dispatchEvent(new a.w.Event('input'));
  await until(()=>a.w.lastPlot!==chart && a.w.lastPlot.scales.x.dir===-1,'Descending calibration did not preserve visual orientation');
  const descending=a.w.lastPlot;assert(descending.valToPos(700,'x')<descending.valToPos(400,'x'),'Graph left did not correspond to preview left');
  checks.push('Descending calibration preserves the preview/spectrum orientation invariant');
  if(new URL(location.href).searchParams.has('screenshot')){window.browserScreenshotReady=true;await until(()=>window.browserScreenshotDone,'Screenshot timeout');}
  a.camera.stopCamera();assert(!a.iframe.contentDocument.querySelector('.uplot'),'Stopped camera retained chart');
  checks.push('Graph clears immediately on camera stop');a.iframe.remove();
  a=await app({canvasFallback:true});await a.camera.startCamera();
  a.w.ignoreFakeConstraints=true;await a.camera.applyTrackConstraint('exposureTime',25);
  assert(!a.core.state.track && !a.core.state.measurementReady,'Ignored camera constraints left measurements active');
  checks.push('Unconfirmed settings stop acquisition instead of claiming successful measurement');a.iframe.remove();
  a=await app({canvasFallback:true});await a.camera.startCamera();const disconnected=a.core.state.track;disconnected.readyState='ended';disconnected.dispatchEvent(new a.w.Event('ended'));
  assert(!a.core.state.track && !a.operations.cameraOperations.active,'Disconnected track did not clear lifecycle');
  checks.push('Track ended cancels acquisition and clears measurement state');a.iframe.remove();
  a=await app({hiddenLabels:true,canvasFallback:true});await a.camera.startCamera();
  assert(a.core.state.track?.label.includes('USB-ZH'),'Hidden-label discovery failed');
  assert(a.w.fakeTracks.some(track=>track.label==='HP Camera' && track.readyState==='ended'),'Permission probe stream leaked');
  a.camera.stopCamera();
  const zero=JSON.parse(await (await fetch('/prototype/configs/lgs-default.json')).text());zero.id='zero-profile';zero.name='Zero settings';zero.cameraSettings.contrast=0;zero.cameraSettings.saturation=0;zero.cameraSettings.sharpness=0;
  const transfer=new a.w.DataTransfer();transfer.items.add(new a.w.File([JSON.stringify(zero)],'zero.json',{type:'application/json'}));
  const file=a.iframe.contentDocument.querySelector('#instrumentProfileFile');file.files=transfer.files;file.dispatchEvent(new a.w.Event('change'));
  await until(()=>a.core.state.instrumentProfile?.id==='zero-profile','Profile import failed');
  a.iframe.contentDocument.querySelector('#instrumentProfileExport').click();const zeros=JSON.parse(await (await a.w.fakeDownloads.at(-1).blob).text());
  assert(zeros.cameraSettings.contrast===0 && zeros.cameraSettings.saturation===0 && zeros.cameraSettings.sharpness===0,'Stopped profile export replaced zero values with defaults');
  await a.camera.startCamera();assert(a.core.state.track?.getSettings().contrast===0,'Imported fixed parameters not applied');
  checks.push('Permission probe cleanup and profile import/export preserve valid zero settings');
  a.camera.stopCamera();a.iframe.remove();
  a=await app({canvasFallback:true});await a.camera.startCamera();a.core.state.track.settings.whiteBalanceMode='continuous';
  await until(()=>!a.core.state.track,'Unexpected hardware auto mode was accepted');
  checks.push('Unexpected automatic camera mode stops measurement');a.iframe.remove();
  window.browserTestResult={checks};
} catch(error) {window.browserTestResult={checks,error:error.stack};}
</script>
